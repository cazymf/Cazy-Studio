name: Publish Cazy Studio v0.3.3 smooth-preview fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.3-preview-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get verified v0.3.2 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cazy"
          gh release download v0.3.2 --repo "$GITHUB_REPOSITORY" --pattern 'Cazy_Studio_v0_3_2_Update.zip' --dir "$RUNNER_TEMP/cazy"
          cd "$RUNNER_TEMP/cazy"
          unzip -q Cazy_Studio_v0_3_2_Update.zip

      - name: Apply asynchronous playback/timeline patch
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy"
          python - <<'PY'
          import base64, io, os, tarfile, zlib
          data = zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          with tarfile.open(fileobj=io.BytesIO(data)) as archive:
              for member in archive.getmembers():
                  assert member.name in {'preview_worker.py', 'app_patch_edit.py'} and member.isfile()
                  with open(member.name, 'wb') as f:
                      f.write(archive.extractfile(member).read())
          PY
          python app_patch_edit.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
              'app.py':'597f0b19f590517c826f0fc1eb93942b78521ec1da1eace7ae635fed7c48ba76',
              'preview_worker.py':'ab8ed02f809eccd669aea29321eb219e6961d91471040ef691f162ddd028ca24'
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name+' failed validated patch check'
          p=Path('update_core.py')
          s=p.read_text()
          assert "APP_VERSION = '0.3.2'" in s
          s=s.replace("APP_VERSION = '0.3.2'","APP_VERSION = '0.3.3'",1)
          needle="'Cazy Studio.exe', 'app.py', 'engine.py'"
          assert needle in s
          s=s.replace(needle,"'Cazy Studio.exe', 'app.py', 'preview_worker.py', 'engine.py'",1)
          p.write_text(s)
          Path('version.py').write_text("APP_VERSION = '0.3.3'\n")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '89bae1af854b3fa525babf39941a5d27c7900fa30c09704a75db689f09d48dbe'
          PY

      - name: Package validated v0.3.3 update
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy"
          python - <<'PY'
          import json,zipfile,hashlib
          from pathlib import Path
          files=['app.py','preview_worker.py','update_core.py','version.py']
          manifest={'product':'CazyStudio','format':1,'version':'0.3.3',
                    'files':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}}
          with zipfile.ZipFile('Cazy_Studio_v0_3_3_Update.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('update_manifest.json',json.dumps(manifest,indent=2))
              for name in files:z.write(name,name)
          import update_core
          assert update_core.inspect_update_zip('Cazy_Studio_v0_3_3_Update.zip','0.3.3')
          PY

      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy"
          if gh release view v0.3.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.3 Cazy_Studio_v0_3_3_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.3 Cazy_Studio_v0_3_3_Update.zip --repo "$GITHUB_REPOSITORY" --title 'Cazy Studio v0.3.3 - Smooth Editing' --notes 'Moves preview decoding, resizing and conversion off the Tk editing thread. Coalesces stale seek requests, debounces resize, and removes expensive timeline redraws while scrubbing. Keeps v0.3.2 rendering improvements.'
          fi
          gh release edit v0.3.3 --repo "$GITHUB_REPOSITORY" --latest

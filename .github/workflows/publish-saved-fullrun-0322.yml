name: Publish Cazy Studio v0.3.22 — Saved Full Run Cuts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-saved-fullrun-0322.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR, GUI, and media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Verify cached cuts and Full Run mode GUI review, OCR and rendering
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
      - name: Build and apply ZIP using actual installed v0.3.21 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy322/base /tmp/cazy322/stage /tmp/cazy322/out
          gh release download v0.3.21 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_21_Update.zip' --dir /tmp/cazy322/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy322/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy322')
          previous=root/'base/Cazy_Studio_v0_3_21_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_22_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.22')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.22')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.21')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.22')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.22'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              assert 'RENDER COMPLETE — 100%' in (installed/'app.py').read_text()
              assert 'NVENC API' in (installed/'quality_engine.py').read_text()
              assert 'last_render_error.log' in (installed/'quality_engine.py').read_text()
              assert "'Error Log'" in (installed/'app.py').read_text()
              assert "'REVIEW SAVED CUTS'" in (installed/'app.py').read_text()
              assert '_autodirector_load_scan_cache' in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.21'"
          print('v0.3.21 updater installed/rolled back v0.3.22: PASS')
          PY
      - name: Publish verified saved Full Run scan update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy322/out
          if gh release view v0.3.22 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.22 Cazy_Studio_v0_3_22_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.22 Cazy_Studio_v0_3_22_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.22 — Scan Once, Retry Rendering Anytime' \
              --notes 'AutoDirector now saves completed Full Run OCR scan results and reviewed cut boundaries to local app data. A dedicated REVIEW SAVED CUTS button reopens detected chambers without launching OCR, including after the application closes or a render fails. Reviewer timestamp edits, enabled and disabled halves, and added manual halves persist immediately. Each saved scan is keyed by the ordered source recording paths and verified against file size and modification timestamp to reject stale cuts when recordings change. SCAN AGAIN (OCR) remains available for deliberately refreshing the detection. Original recordings remain untouched. Preserves the NVENC legacy compatibility path, 240 FPS presets, one-video export and persistent Error Log. Verified by isolated cache tests, GUI smoke tests and updater installation and rollback tests.'
          fi
          gh release edit v0.3.22 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_22_Update
          path: /tmp/cazy322/out/Cazy_Studio_v0_3_22_Update.zip
          if-no-files-found: error

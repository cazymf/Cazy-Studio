name: Validate Cazy Studio v0.3.11 Full Run
on:
  push:
    branches: [feature/autodirector-fullrun-0311]
    paths:
      - 'source/**'
      - 'tests/**'
      - '.github/workflows/test-fullrun-0311.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install local media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Test multi-chamber detection, real concat and GUI
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
      - name: Test update zip and rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy311/old /tmp/cazy311/stage /tmp/cazy311/out
          gh release download v0.3.10 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_10_Update.zip' --dir /tmp/cazy311/old
          cp source/app.py source/autodirector_fullrun.py \
            source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy311/stage/
          PYTHONPATH=source python - <<'PY'
          from pathlib import Path
          import tempfile,zipfile
          from update_core import build_update_zip,inspect_update_zip,apply_update_zip,rollback_latest
          old=Path('/tmp/cazy311/old/Cazy_Studio_v0_3_10_Update.zip')
          target=Path('/tmp/cazy311/out/Cazy_Studio_v0_3_11_Update.zip')
          prior=inspect_update_zip(old,'0.3.10')
          manifest=build_update_zip('/tmp/cazy311/stage',target,'0.3.11')
          assert set(manifest['files'])=={
              'app.py','autodirector_fullrun.py','quality_engine.py',
              'quality_ui.py','update_core.py','version.py'}
          with tempfile.TemporaryDirectory() as d:
              root=Path(d)
              with zipfile.ZipFile(old) as archive:
                  for name in prior['files']:
                      (root/name).write_bytes(archive.read(name))
              apply_update_zip(target,root,'0.3.11')
              assert (root/'version.py').read_text().strip()=="APP_VERSION = '0.3.11'"
              assert (root/'autodirector_fullrun.py').is_file()
              rollback_latest(root)
              assert not (root/'autodirector_fullrun.py').exists()
              assert (root/'version.py').read_text().strip()=="APP_VERSION = '0.3.10'"
          print('v0.3.11 install and rollback: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_11_PREVIEW
          path: /tmp/cazy311/out/Cazy_Studio_v0_3_11_Update.zip
          if-no-files-found: error

name: Publish Cazy Studio v0.3.21 — Persistent Render Error Diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-render-error-logging-0321.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR, GUI, and media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Regression-test silent FFmpeg errors, NVENC, OCR and GUI
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
      - name: Build and apply ZIP using actual installed v0.3.20 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy321/base /tmp/cazy321/stage /tmp/cazy321/out
          gh release download v0.3.20 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_20_Update.zip' --dir /tmp/cazy321/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy321/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy321')
          previous=root/'base/Cazy_Studio_v0_3_20_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_21_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.21')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.21')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.20')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.21')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.21'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              assert 'RENDER COMPLETE — 100%' in (installed/'app.py').read_text()
              assert 'NVENC API' in (installed/'quality_engine.py').read_text()
              assert 'last_render_error.log' in (installed/'quality_engine.py').read_text()
              assert "'Error Log'" in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.20'"
          print('v0.3.20 updater installed/rolled back v0.3.21: PASS')
          PY
      - name: Publish verified persistent error logging update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy321/out
          if gh release view v0.3.21 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.21 Cazy_Studio_v0_3_21_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.21 Cazy_Studio_v0_3_21_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.21 — Render Error Logs and Exit Codes' \
              --notes 'Fixes blank Processing failed popup after a rendering subprocess exits with no stderr text. Captures the actual executable, full FFmpeg command, process exit code and hexadecimal Windows return code in a persistent local file under CazyStudio/logs/last_render_error.log. Saves Python tracebacks for unexpected AutoDirector failures. Adds an Error Log button that can reopen the most recent diagnostic even after a Windows popup is dismissed. Preserves existing OCR detection, all reviewed clips, one Full Run video export, saved Quality Lab presets, the optional older NVENC API compatibility path and user-selected 240 FPS outputs. All changes are local and diagnostic information is not uploaded. Release requires automated regression tests and updater installation and rollback checks.'
          fi
          gh release edit v0.3.21 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_21_Update
          path: /tmp/cazy321/out/Cazy_Studio_v0_3_21_Update.zip
          if-no-files-found: error

name: Publish Cazy Studio v0.3.18 — Rapid Start Challenge OCR
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rapid-start-ocr-0318.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR, GUI, and media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Regression-test four rapid Start prompts, other OCR, rendering, GUI
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
      - name: Build and apply ZIP using actual installed v0.3.17 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy318/base /tmp/cazy318/stage /tmp/cazy318/out
          gh release download v0.3.17 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_17_Update.zip' --dir /tmp/cazy318/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy318/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy318')
          previous=root/'base/Cazy_Studio_v0_3_17_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_18_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.18')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.18')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.17')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.18')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.18'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.17'"
          print('v0.3.17 updater installed/rolled back v0.3.18: PASS')
          PY
      - name: Publish tested rapid Start Challenge OCR update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy318/out
          if gh release view v0.3.18 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.18 Cazy_Studio_v0_3_18_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.18 Cazy_Studio_v0_3_18_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.18 — Rapid Start Challenge OCR Fix' \
              --notes 'Fixes Spiral Abyss AutoDirector missing brief Start Challenge HUD prompts during a Full Run scan. Increases video frame sampling to approximately eight frames per second, adds a fast localized English OCR pass while waiting for the next chamber-side start, alternates grayscale and thresholded crops, and preserves the slower general OCR for side switches, completion and failures. Keeps 2-second pre-roll on each start, manual review, combined one-video export, previous RIFE-v4 compatibility fix, saved Quality Lab recipes and silent Windows OCR processes. Tested with short prompt appearances on both sides of two synthetic chambers and existing OCR, updater, RIFE and GUI regression tests. Accuracy on the user's full original OBS video is not yet verified.'
          fi
          gh release edit v0.3.18 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_18_Update
          path: /tmp/cazy318/out/Cazy_Studio_v0_3_18_Update.zip
          if-no-files-found: error

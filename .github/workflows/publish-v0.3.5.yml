name: Publish Cazy Studio v0.3.5 render presets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.3.5.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild verified render preset update
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_B64: ''
          EXPECTED_HASHES: '{"app.py":"8c008c0bf07dd0712e58c6c57524ef78a0925a2048c1f8138b0ff327fc8eba62","quality_engine.py":"6f254f7c43d4b4b43c977745aca0c83e510aa03a5b506c5f7a4b0a6b3cb364ea","quality_ui.py":"aa62b216c5b6d694d59332a12c049f6a46229f0b16085dbfe8bb87bbba766c02","update_core.py":"c421de76746732a9d22149f2e485ee8b98a44be9970447eb01306efe3aad9cd7","version.py":"e3443e7baf0254dce066447daac9e6c5fd22def6acf0aa82b5606e0e09e50f67"}'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cazy035"
          cd "$RUNNER_TEMP/cazy035"
          gh release download v0.3.4 --repo "$GITHUB_REPOSITORY" --pattern 'Cazy_Studio_v0_3_4_Update.zip'
          python - <<'PY'
          import os, zipfile, pathlib, hashlib, base64, zlib
          expected_old = {
           'app.py':'8d340d8a698f604a2f2a5bb1573ce94a817076b95c2e670204e545d241e0646c',
           'quality_engine.py':'ef672bc87a407f458c1e2c0eee0c7a0c539fb33e5f42a36e49df89937bcacb38',
           'quality_ui.py':'3e1e606c66d6cb530c87bf1dd424d186e68e45de6d2f8ba8545b449b3883d762',
           'update_core.py':'d4b8ea5e9da3e4ed8d2fed65c37b85f28928b757ed1f7788ccda3b74a9c0cfbc',
           'version.py':'c0a043decbf147d6bc5b53aa69fe7a1ad92b1f886895bb74e2948583f684b531'
          }
          with zipfile.ZipFile('Cazy_Studio_v0_3_4_Update.zip') as z:
           for name, sha in expected_old.items():
            data=z.read(name)
            assert hashlib.sha256(data).hexdigest()==sha,(name,'old checksum mismatch')
            pathlib.Path(name).write_bytes(data)
          pathlib.Path('changes.patch').write_bytes(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          PY
          patch -p1 --batch -i changes.patch
          python - <<'PY'
          import json,os,hashlib,zipfile,pathlib
          expected=json.loads(os.environ['EXPECTED_HASHES'])
          for name,sha in expected.items():
           assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha,(name,'new checksum mismatch')
          manifest={'product':'CazyStudio','format':1,'version':'0.3.5','files':expected}
          with zipfile.ZipFile('Cazy_Studio_v0_3_5_Update.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
           for name in expected:z.write(name,name)
           z.writestr('update_manifest.json',json.dumps(manifest,indent=2))
          with zipfile.ZipFile('Cazy_Studio_v0_3_5_Update.zip') as z:
           assert json.loads(z.read('update_manifest.json'))['version']=='0.3.5'
          print('Verified update ZIP',pathlib.Path('Cazy_Studio_v0_3_5_Update.zip').stat().st_size)
          PY
      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy035"
          if gh release view v0.3.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.5 Cazy_Studio_v0_3_5_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.5 Cazy_Studio_v0_3_5_Update.zip --repo "$GITHUB_REPOSITORY" --title 'Cazy Studio v0.3.5 — Saved Render Presets' --notes 'Adds Save, Load, Delete render presets and auto-restores last-used Quality Lab settings. Saves files in user AppData so future updates preserve presets. Clip trim is never saved in presets. Built and verified against the previous v0.3.4 release.'
          fi
          gh release edit v0.3.5 --repo "$GITHUB_REPOSITORY" --latest

name: Publish Cazy Studio v0.3.26 — Music Hunter Beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-music-hunter-0326.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR, GUI, and media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Verify Music Hunter, OCR and GUI regressions
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_export_0323.py
      - name: Build and apply ZIP using actual installed v0.3.25 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy326/base /tmp/cazy326/stage /tmp/cazy326/out
          gh release download v0.3.25 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_25_Update.zip' --dir /tmp/cazy326/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy326/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy326')
          previous=root/'base/Cazy_Studio_v0_3_25_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_26_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.26')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.26')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.25')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.26')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.26'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              assert 'RENDER COMPLETE — 100%' in (installed/'app.py').read_text()
              assert 'NVENC API' in (installed/'quality_engine.py').read_text()
              assert 'last_render_error.log' in (installed/'quality_engine.py').read_text()
              assert "'Error Log'" in (installed/'app.py').read_text()
              assert "'REVIEW SAVED CUTS'" in (installed/'app.py').read_text()
              assert '_autodirector_load_scan_cache' in (installed/'app.py').read_text()
              assert 'self.export_window.lift()' in (installed/'app.py').read_text()
              assert 'Live Render Progress' in (installed/'quality_ui.py').read_text()
              assert 'def _cazy_ocr_frame_stream(' in (installed/'quality_engine.py').read_text()
              assert 'class _CazyOCRDecoderFailure' in (installed/'quality_engine.py').read_text()
              assert 'def music_hunter_search(' in (installed/'quality_engine.py').read_text()
              assert 'def music_hunter_import(' in (installed/'quality_engine.py').read_text()
              assert 'class MusicHunterWindow(' in (installed/'app.py').read_text()
              assert '♫ MUSIC HUNTER (BETA)' in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.25'"
          print('v0.3.25 updater installed/rolled back v0.3.26: PASS')
          PY
      - name: Publish verified Music Hunter beta update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy326/out
          if gh release view v0.3.26 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.26 Cazy_Studio_v0_3_26_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.26 Cazy_Studio_v0_3_26_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.26 — Music Hunter Beta' \
              --notes 'Introduces Music Hunter Beta inside AutoDirector: recent-first YouTube video discovery with verified upload-date filtering (1/3/6/12 months), result previews in the browser, an explicit user-permission confirmation, one-click optional yt-dlp installation, and video URL or search-result to MP3 import via bundled FFmpeg. Saves MP3s in the chosen AutoDirector music library and retains existing music mix levels. Search is rules-based, not an LLM or license verifier; original song release dates cannot always be determined, and licensing requires creator verification. Also fixes the Quality Lab title to use the installed version. Preserves v0.3.25 OCR crash isolation, successful Abyss cuts, Full Run single MP4, NVENC, RIFE, Real-ESRGAN, presets and saved scans. This is the first shipped slice of the larger AI roadmap; Highlight Intelligence, RealBasicVSR, EGVSR and retry detection remain planned. Tested through Linux OCR, music-regression and GUI suite, and updater install/rollback; validate real-world YouTube search and audio import on Windows.'
          fi
          gh release edit v0.3.26 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_26_Update
          path: /tmp/cazy326/out/Cazy_Studio_v0_3_26_Update.zip
          if-no-files-found: error
# Automated release for the first incremental music discovery feature.

# CI revision 2: enable optional YouTube music feature without altering local video source guarantees.

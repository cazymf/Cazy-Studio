name: Publish Cazy Studio v0.3.19 — Visible AutoDirector Rendering Progress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-render-progress-0319.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR, GUI, and media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Regression-test live render percentage, OCR, rendering, GUI
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
      - name: Build and apply ZIP using actual installed v0.3.18 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy319/base /tmp/cazy319/stage /tmp/cazy319/out
          gh release download v0.3.18 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_18_Update.zip' --dir /tmp/cazy319/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy319/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy319')
          previous=root/'base/Cazy_Studio_v0_3_18_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_19_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.19')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.19')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.18')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.19')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.19'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              assert 'RENDER COMPLETE — 100%' in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.18'"
          print('v0.3.18 updater installed/rolled back v0.3.19: PASS')
          PY
      - name: Publish verified visible render progress update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy319/out
          if gh release view v0.3.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.19 Cazy_Studio_v0_3_19_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.19 Cazy_Studio_v0_3_19_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.19 — Visible AutoDirector Render Progress' \
              --notes 'Adds visible AutoDirector rendering progress to the existing scan progress panel. Live percentage, progress bar, elapsed time and current processing stage are shown while RIFE interpolation, Real-ESRGAN, encoding, clip joining and output saving proceed. A new render starts at zero percent and finishes at one hundred percent with the output file path. Both reviewed clip export and Full Run export use the same render progress panel. Preserves v0.3.18 Start Challenge OCR, v0.3.17 RIFE fix, presets and approved updater files. Regression tests include a real Tk GUI smoke test verifying render progress is visible and a v0.3.18 updater installation and rollback test.'
          fi
          gh release edit v0.3.19 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_19_Update
          path: /tmp/cazy319/out/Cazy_Studio_v0_3_19_Update.zip
          if-no-files-found: error

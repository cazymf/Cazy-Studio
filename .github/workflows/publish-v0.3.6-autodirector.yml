name: Publish Cazy Studio v0.3.6 AutoDirector workspace
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.3.6-autodirector.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and verify AutoDirector workspace patch
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_B64: ''
          BASE_HASHES: '{"app.py":"8c008c0bf07dd0712e58c6c57524ef78a0925a2048c1f8138b0ff327fc8eba62","update_core.py":"c421de76746732a9d22149f2e485ee8b98a44be9970447eb01306efe3aad9cd7","version.py":"e3443e7baf0254dce066447daac9e6c5fd22def6acf0aa82b5606e0e09e50f67"}'
          FINAL_HASHES: '{"app.py":"e726b86bd71c7bd35e3b9969760b65517348f8da64f3b98cf7f079375332638c","update_core.py":"bc594641af95946cae6e648e50a2f6d2e9b3cf62ea6309af1500cc99db6bb7d8","version.py":"020e09cd65f5eb9e357760e2d8577ae39c809e1f27b1ecfd7c961aa9d0fd8944"}'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cazy036"
          cd "$RUNNER_TEMP/cazy036"
          gh release download v0.3.5 --repo "$GITHUB_REPOSITORY" --pattern 'Cazy_Studio_v0_3_5_Update.zip'
          python - <<'PYWORK'
          import os,zipfile,hashlib,json,base64,zlib
          from pathlib import Path
          source=json.loads(os.environ['BASE_HASHES'])
          with zipfile.ZipFile('Cazy_Studio_v0_3_5_Update.zip') as z:
              for name,sha in source.items():
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==sha,('Unexpected base file',name)
                  Path(name).write_bytes(data)
          Path('changes.patch').write_bytes(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          PYWORK
          patch --batch -p1 -i changes.patch
          python - <<'PYWORK'
          import os,json,hashlib,zipfile
          from pathlib import Path
          files=json.loads(os.environ['FINAL_HASHES'])
          for name,sha in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,('Patched file mismatch',name)
          manifest={'product':'CazyStudio','format':1,'version':'0.3.6','files':files}
          with zipfile.ZipFile('Cazy_Studio_v0_3_6_Update.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('update_manifest.json',json.dumps(manifest,indent=2))
              for name in files:z.write(name,name)
          with zipfile.ZipFile('Cazy_Studio_v0_3_6_Update.zip') as z:
              assert json.loads(z.read('update_manifest.json'))==manifest
          print('Valid AutoDirector update:',Path('Cazy_Studio_v0_3_6_Update.zip').stat().st_size,'bytes')
          PYWORK
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy036"
          if gh release view v0.3.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.6 Cazy_Studio_v0_3_6_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.6 Cazy_Studio_v0_3_6_Update.zip --repo "$GITHUB_REPOSITORY" --title 'Cazy Studio v0.3.6 — AutoDirector Workspace' --notes 'Adds a native AutoDirector workspace tab with a persistent multi-video OBS queue, add-folder import, queue reordering, music library, random per-video song assignment, anti-repeat shuffle, processing mode selection, render preset selection, and future YouTube visibility settings. Local-first; no OpenAI key required. Automated Genshin fight recognition, batch rendering and YouTube publishing are not enabled yet.'
          fi
          gh release edit v0.3.6 --repo "$GITHUB_REPOSITORY" --latest
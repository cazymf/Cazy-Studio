name: Publish Cazy Studio v0.3.17 — RIFE Model Compatibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rife-compat-0317.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR, GUI, and media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Regression-test RIFE negotiation, OCR, legacy version checks and Full Run GUI
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
      - name: Build and apply ZIP using actual installed v0.3.16 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy317/base /tmp/cazy317/stage /tmp/cazy317/out
          gh release download v0.3.16 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_16_Update.zip' --dir /tmp/cazy317/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy317/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy317')
          previous=root/'base/Cazy_Studio_v0_3_16_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_17_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.17')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.17')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.16')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.17')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.17'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.16'"
          print('v0.3.16 updater installed/rolled back v0.3.17: PASS')
          PY
      - name: Publish tested RIFE compatibility update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy317/out
          if gh release view v0.3.17 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.17 Cazy_Studio_v0_3_17_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.17 Cazy_Studio_v0_3_17_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.17 — RIFE Model Compatibility Fix' \
              --notes 'Fixes AutoDirector Full Run Quality Lab RIFE rendering failure: only rife-v4 model support custom numframe and timestep. Detects and selects installed RIFE v4 models for arbitrary output frame counts. Legacy RIFE models are used in their supported 2x mode without custom frame-count flags. Saved Quality Lab presets, local OCR scanning, 2-second cut pre-roll and combined Full Run MP4 remain intact. Includes automated compatibility regression tests and prior updater install/rollback verification. Full OBS detection accuracy remains under investigation.'
          fi
          gh release edit v0.3.17 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_17_Update
          path: /tmp/cazy317/out/Cazy_Studio_v0_3_17_Update.zip
          if-no-files-found: error

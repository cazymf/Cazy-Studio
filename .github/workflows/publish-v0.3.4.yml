name: Publish Cazy Studio v0.3.4 trim and render progress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact previous update sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cazy034"
          cd "$RUNNER_TEMP/cazy034"
          gh release download v0.3.3 --repo "$GITHUB_REPOSITORY" --pattern 'Cazy_Studio_v0_3_3_Update.zip'
          gh release download v0.3.2 --repo "$GITHUB_REPOSITORY" --pattern 'Cazy_Studio_v0_3_2_Update.zip'
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('Cazy_Studio_v0_3_3_Update.zip') as z:
              for name in ('app.py','update_core.py','version.py'):
                  Path(name).write_bytes(z.read(name))
          with zipfile.ZipFile('Cazy_Studio_v0_3_2_Update.zip') as z:
              for name in ('quality_engine.py','quality_ui.py'):
                  Path(name).write_bytes(z.read(name))
          PY

      - name: Rebuild preview worker and apply tested fixes
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy034"
          python - <<'PY'
          import os,base64,zlib,tarfile,io,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as tf:
              for m in tf:
                  assert m.name in ('patch.py','patch_progress.py') and m.isfile()
                  Path(m.name).write_bytes(tf.extractfile(m).read())
          source=Path('app.py').read_text()
          assert hashlib.sha256(source.encode()).hexdigest()=='5201431fea1053e2bc2934bc4ffbbe2e7cc83e310654e5c0bbfe99ca1c375f31'
          a=source.index('class PreviewDecoder:')
          b=source.index('\n\nclass Studio(tk.Tk):',a)
          decoder=source[a:b]
          header='''"""Non-blocking latest-frame decoder for Cazy Studio's editing monitor.

          This worker never touches Tk widgets. OpenCV video decoding, optional resizing,
          and PIL pixel conversion happen off the GUI thread. New scrubbing positions
          replace old pending requests so playback cannot build an enormous backlog.
          """
          from __future__ import annotations
          import queue
          import threading
          from pathlib import Path
          from PIL import Image

          try:
              import cv2
          except ImportError:
              cv2 = None

          import engine


          '''
          # Remove YAML block indentation from the embedded Python module header.
          header='\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines())+'\n'
          Path('preview_worker.py').write_text(header+decoder)
          assert hashlib.sha256(Path('preview_worker.py').read_bytes()).hexdigest()=='ab8ed02f809eccd669aea29321eb219e6961d91471040ef691f162ddd028ca24'
          source=(source[:a]+source[b+2:]).replace('import engine as preview_tools\n','import engine as preview_tools\nfrom preview_worker import PreviewDecoder\n',1)
          Path('app.py').write_text(source)
          assert hashlib.sha256(Path('app.py').read_bytes()).hexdigest()=='597f0b19f590517c826f0fc1eb93942b78521ec1da1eace7ae635fed7c48ba76'
          PY
          python patch.py
          python patch_progress.py
          sed -i 's/0\.3\.3/0.3.4/' version.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
              'app.py':'8d340d8a698f604a2f2a5bb1573ce94a817076b95c2e670204e545d241e0646c',
              'quality_engine.py':'ef672bc87a407f458c1e2c0eee0c7a0c539fb33e5f42a36e49df89937bcacb38',
              'quality_ui.py':'3e1e606c66d6cb530c87bf1dd424d186e68e45de6d2f8ba8545b449b3883d762',
              'update_core.py':'d4b8ea5e9da3e4ed8d2fed65c37b85f28928b757ed1f7788ccda3b74a9c0cfbc',
              'version.py':'c0a043decbf147d6bc5b53aa69fe7a1ad92b1f886895bb74e2948583f684b531',
              'preview_worker.py':'ab8ed02f809eccd669aea29321eb219e6961d91471040ef691f162ddd028ca24'
          }
          for name,digest in expected.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==digest, f'{name}: {actual} does not match {digest}'
          PY

      - name: Package and validate v0.3.4
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy034"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,py_compile
          files=['app.py','preview_worker.py','quality_engine.py','quality_ui.py','update_core.py','version.py']
          for name in files:py_compile.compile(name,doraise=True)
          manifest={'product':'CazyStudio','format':1,'version':'0.3.4',
                    'files':{f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files}}
          with zipfile.ZipFile('Cazy_Studio_v0_3_4_Update.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in files:z.write(name,name)
              z.writestr('update_manifest.json',json.dumps(manifest,indent=2))
          import update_core
          assert update_core.inspect_update_zip('Cazy_Studio_v0_3_4_Update.zip','0.3.4')
          PY

      - name: Publish newest verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cazy034"
          if gh release view v0.3.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.4 Cazy_Studio_v0_3_4_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.4 Cazy_Studio_v0_3_4_Update.zip --repo "$GITHUB_REPOSITORY" --title 'Cazy Studio v0.3.4 - Trim & Render Progress' --notes 'Quality Lab now respects the selected trimmed timeline clip. Accurate weighted render progress tracks FFmpeg extraction, AI upscaled-frame completion and MP4 encoding. Existing v0.3.3 users are compatible.'
          fi
          gh release edit v0.3.4 --repo "$GITHUB_REPOSITORY" --latest

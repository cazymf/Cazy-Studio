name: Publish Cazy Studio v0.3.16 — Visible OCR Scan Progress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ocr-progress-0316.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install offline OCR, GUI, and media tooling
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Verify progress, OCR, full-run joining and GUI
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
      - name: Build and apply ZIP using actual installed v0.3.15 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy316/base /tmp/cazy316/stage /tmp/cazy316/out
          gh release download v0.3.15 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_15_Update.zip' --dir /tmp/cazy316/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy316/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy316')
          previous=root/'base/Cazy_Studio_v0_3_15_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_16_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.16')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.16')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.15')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.16')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.16'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.15'"
          print('v0.3.15 updater installed/rolled back v0.3.16: PASS')
          PY
      - name: Publish tested OCR progress update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy316/out
          if gh release view v0.3.16 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.16 Cazy_Studio_v0_3_16_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.16 Cazy_Studio_v0_3_16_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.16 — Visible OCR Progress and Better Abyss Detection' \
              --notes 'Fixes hidden AutoDirector scan status and missed Abyss transition text. Adds a permanently visible progress bar directly above SCAN / REVIEW RUN, live percent, current selected video, video timestamp, estimated scan time remaining, and live counts of recognized Start, Other Side, Completed and Failed events. OCR now samples gameplay frames more frequently, quickly checks near-black transition screens for the brief "On the other side..." text, and prioritizes the darkened "Challenge Completed" banner. Uses actual recognized text, never screenshot comparisons. Keeps a 2-second pre-roll before each Start Challenge, original recordings untouched, saved Quality Lab render presets, all completed chambers joined into ONE Full Run MP4, and no YouTube publishing. Verified with 46 regression tests, actual local Tesseract on synthetic half-second screen transitions, original game screenshot OCR checks, GUI smoke, and exact v0.3.15 updater install/rollback. Actual full OBS recordings remain the next accuracy test.'
          fi
          gh release edit v0.3.16 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_16_Update
          path: /tmp/cazy316/out/Cazy_Studio_v0_3_16_Update.zip
          if-no-files-found: error

name: Publish Cazy Studio v0.3.29 — Random Export Music Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-random-music-0329.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR, GUI, and media test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-python-headless numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Verify music at export, Full Run, batch import, GUI and OCR
        run: |
          set -euo pipefail
          python -m compileall -q source tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_037.py
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_export_0323.py
          xvfb-run -a /usr/bin/python3 tests/gui_smoke_music_hunter_0328.py
      - name: Build and apply ZIP using actual installed v0.3.28 updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cazy329/base /tmp/cazy329/stage /tmp/cazy329/out
          gh release download v0.3.28 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cazy_Studio_v0_3_28_Update.zip' --dir /tmp/cazy329/base
          cp source/app.py source/quality_engine.py source/quality_ui.py \
            source/update_core.py source/version.py /tmp/cazy329/stage/
          PYTHONPATH=source python - <<'PY'
          import tempfile,zipfile,importlib.util
          from pathlib import Path
          from update_core import build_update_zip
          root=Path('/tmp/cazy329')
          previous=root/'base/Cazy_Studio_v0_3_28_Update.zip'
          update=root/'out/Cazy_Studio_v0_3_29_Update.zip'
          manifest=build_update_zip(root/'stage',update,'0.3.29')
          approved={'app.py','quality_engine.py','quality_ui.py','update_core.py','version.py'}
          assert set(manifest['files'])==approved
          with tempfile.TemporaryDirectory() as location:
              folder=Path(location)
              old_module=folder/'legacy.py'
              with zipfile.ZipFile(previous) as z:
                  old_module.write_bytes(z.read('update_core.py'))
              spec=importlib.util.spec_from_file_location('legacy_updater',old_module)
              legacy=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(legacy)
              assert approved.issubset(legacy.SAFE_FILES)
              assert set(legacy.inspect_update_zip(update,'0.3.29')['files'])==approved
              installed=folder/'installation'
              installed.mkdir()
              with zipfile.ZipFile(previous) as z:
                  old_manifest=legacy.inspect_update_zip(previous,'0.3.28')
                  for filename in old_manifest['files']:
                      (installed/filename).write_bytes(z.read(filename))
              legacy.apply_update_zip(update,installed,'0.3.29')
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.29'"
              assert 'SCAN STATUS: Ready' in (installed/'app.py').read_text()
              assert 'RENDER COMPLETE — 100%' in (installed/'app.py').read_text()
              assert 'NVENC API' in (installed/'quality_engine.py').read_text()
              assert 'last_render_error.log' in (installed/'quality_engine.py').read_text()
              assert "'Error Log'" in (installed/'app.py').read_text()
              assert "'REVIEW SAVED CUTS'" in (installed/'app.py').read_text()
              assert '_autodirector_load_scan_cache' in (installed/'app.py').read_text()
              assert 'self.export_window.lift()' in (installed/'app.py').read_text()
              assert 'Live Render Progress' in (installed/'quality_ui.py').read_text()
              assert 'def _cazy_ocr_frame_stream(' in (installed/'quality_engine.py').read_text()
              assert 'class _CazyOCRDecoderFailure' in (installed/'quality_engine.py').read_text()
              assert 'def music_hunter_search(' in (installed/'quality_engine.py').read_text()
              assert 'def music_hunter_import(' in (installed/'quality_engine.py').read_text()
              assert 'class MusicHunterWindow(' in (installed/'app.py').read_text()
              assert '♫ MUSIC HUNTER (BETA)' in (installed/'app.py').read_text()
              assert 'def _autodirector_choose_export_music(' in (installed/'app.py').read_text()
              assert 'def music_hunter_import_batch(' in (installed/'quality_engine.py').read_text()
              assert '⬇ DOWNLOAD ALL SELECTED → MP3 → CAZY MUSIC FOLDER' in (installed/'app.py').read_text()
              legacy.rollback_latest(installed)
              assert (installed/'version.py').read_text().strip()=="APP_VERSION = '0.3.28'"
          print('v0.3.28 updater installed/rolled back v0.3.29: PASS')
          PY
      - name: Publish verified random background music fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/cazy329/out
          if gh release view v0.3.29 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.29 Cazy_Studio_v0_3_29_Update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.29 Cazy_Studio_v0_3_29_Update.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Cazy Studio v0.3.29 — Random Background Music on Export' \
              --notes 'Fixes rendered videos missing background music even when Music Hunter imported MP3s and Random song for each video was enabled. AutoDirector Full Run and single reviewed-clip exports now select a fresh random song from the currently selected music folder when the user clicks Render, without requiring a separate Assign Music operation. Honors No back-to-back repeats, remembers the last chosen song, and displays the selected filename in the render confirmation dialog. Warns when a selected music folder contains no supported audio, but preserves intentional music-free renders when no folder is chosen. Preserves current Full Run one-MP4 export, existing FFmpeg game/music audio balance, 2-second OCR pre-roll, RIFE, Real-ESRGAN, NVENC, Music Hunter batch MP3 import, saved scans and Quality Lab presets. Automated tests, GUI smoke tests, and updater install/rollback verified; test with a real Windows Full Run recording.'
          fi
          gh release edit v0.3.29 --repo "$GITHUB_REPOSITORY" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Cazy_Studio_v0_3_29_Update
          path: /tmp/cazy329/out/Cazy_Studio_v0_3_29_Update.zip
          if-no-files-found: error
# Automated release for the first incremental music discovery feature.

# CI revision 2: enable optional YouTube music feature without altering local video source guarantees.

# CI revision 2: updated batch destination persistence assertion.

# CI revision 3: visible Tk root in transient Music Hunter GUI smoke.
